asyncapi: 2.6.0

info:
  title: ShuKnow ChatHub
  version: 1.0.0
  description: Current SignalR contract for AI chat processing and tool-driven file/folder events.

servers:
  local-http:
    url: http://localhost:5209/hubs/chat
    protocol: signalr
    description: Local development endpoint from the `http` launch profile.
  local-https:
    url: https://localhost:7274/hubs/chat
    protocol: signalr
    description: Local development endpoint from the `https` launch profile.

defaultContentType: application/json

channels:
  SendMessage:
    description: Client invokes this hub method to submit a message to the AI workflow.
    publish:
      operationId: SendMessage
      summary: Submit a user message for AI processing
      message:
        $ref: '#/components/messages/SendMessage'

  CancelProcessing:
    description: Client invokes this hub method to cancel the active operation for the current connection.
    publish:
      operationId: CancelProcessing
      summary: Cancel the active AI processing operation
      message:
        $ref: '#/components/messages/CancelProcessing'

  OnValidationFailed:
    subscribe:
      operationId: OnValidationFailed
      summary: Hub command validation failed
      message:
        $ref: '#/components/messages/OnValidationFailed'

  OnProcessingStarted:
    subscribe:
      operationId: OnProcessingStarted
      summary: AI processing started
      message:
        $ref: '#/components/messages/OnProcessingStarted'

  OnMessageChunk:
    subscribe:
      operationId: OnMessageChunk
      summary: Streaming LLM response chunk
      message:
        $ref: '#/components/messages/OnMessageChunk'

  OnMessageCompleted:
    subscribe:
      operationId: OnMessageCompleted
      summary: One AI response message finished streaming
      message:
        $ref: '#/components/messages/OnMessageCompleted'

  OnFileCreated:
    subscribe:
      operationId: OnFileCreated
      summary: AI tools created a file
      message:
        $ref: '#/components/messages/OnFileCreated'

  OnFileMoved:
    subscribe:
      operationId: OnFileMoved
      summary: AI tools moved a file
      message:
        $ref: '#/components/messages/OnFileMoved'

  OnFolderCreated:
    subscribe:
      operationId: OnFolderCreated
      summary: AI tools created a folder
      message:
        $ref: '#/components/messages/OnFolderCreated'

  OnTextAppended:
    subscribe:
      operationId: OnTextAppended
      summary: AI tools appended text to a file
      message:
        $ref: '#/components/messages/OnTextAppended'

  OnTextPrepended:
    subscribe:
      operationId: OnTextPrepended
      summary: AI tools prepended text to a file
      message:
        $ref: '#/components/messages/OnTextPrepended'

  OnAttachmentSaved:
    subscribe:
      operationId: OnAttachmentSaved
      summary: AI tools saved a staged attachment as a file
      message:
        $ref: '#/components/messages/OnAttachmentSaved'

  OnProcessingCompleted:
    subscribe:
      operationId: OnProcessingCompleted
      summary: AI processing finished successfully
      message:
        $ref: '#/components/messages/OnProcessingCompleted'

  OnProcessingFailed:
    subscribe:
      operationId: OnProcessingFailed
      summary: AI processing failed
      message:
        $ref: '#/components/messages/OnProcessingFailed'

components:
  messages:
    SendMessage:
      name: SendMessage
      title: Send Message
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SendMessageCommand'

    CancelProcessing:
      name: CancelProcessing
      title: Cancel Processing
      payload:
        type: 'null'

    OnValidationFailed:
      name: OnValidationFailed
      title: Validation Failed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ValidationFailedEvent'

    OnProcessingStarted:
      name: OnProcessingStarted
      title: Processing Started
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProcessingStartedEvent'

    OnMessageChunk:
      name: OnMessageChunk
      title: Message Chunk
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MessageChunkEvent'

    OnMessageCompleted:
      name: OnMessageCompleted
      title: Message Completed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MessageCompletedEvent'

    OnFileCreated:
      name: OnFileCreated
      title: File Created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FileCreatedEvent'

    OnFileMoved:
      name: OnFileMoved
      title: File Moved
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FileMovedEvent'

    OnFolderCreated:
      name: OnFolderCreated
      title: Folder Created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FolderCreatedEvent'

    OnTextAppended:
      name: OnTextAppended
      title: Text Appended
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TextAppendedEvent'

    OnTextPrepended:
      name: OnTextPrepended
      title: Text Prepended
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TextPrependedEvent'

    OnAttachmentSaved:
      name: OnAttachmentSaved
      title: Attachment Saved
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AttachmentSavedEvent'

    OnProcessingCompleted:
      name: OnProcessingCompleted
      title: Processing Completed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProcessingCompletedEvent'

    OnProcessingFailed:
      name: OnProcessingFailed
      title: Processing Failed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProcessingFailedEvent'

  schemas:
    SendMessageCommand:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: Existing chat session ID created through `POST /api/chat/session`.
        content:
          type: string
          nullable: true
          description: Required when `attachmentIds` is empty.
        context:
          type: string
          nullable: true
          maxLength: 5000
          description: Currently accepted by the command DTO but not used by `ChatHub`.
        attachmentIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid

    ValidationFailedEvent:
      type: object
      required: [targetMethod, errors]
      properties:
        targetMethod:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required: [propertyName, errorMessage]
      properties:
        propertyName:
          type: string
        errorMessage:
          type: string

    ProcessingStartedEvent:
      type: object
      required: [operationId]
      properties:
        operationId:
          type: string
          format: uuid

    MessageChunkEvent:
      type: object
      required: [operationId, messageId, chunk]
      properties:
        operationId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        chunk:
          type: string

    MessageCompletedEvent:
      type: object
      required: [operationId, messageId]
      properties:
        operationId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid

    FileCreatedEvent:
      type: object
      required: [fileId, name, description, contentType]
      properties:
        fileId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        contentType:
          type: string

    FileMovedEvent:
      type: object
      required: [fileId, fileName]
      properties:
        fileId:
          type: string
          format: uuid
        fileName:
          type: string
        fromFolderId:
          type: string
          format: uuid
          nullable: true
        toFolderId:
          type: string
          format: uuid
          nullable: true

    FolderCreatedEvent:
      type: object
      required: [folderId, name, description, parentFolderId, sortOrder]
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        emoji:
          type: string
          nullable: true
        parentFolderId:
          type: string
          format: uuid
          nullable: true
        sortOrder:
          type: integer

    TextAppendedEvent:
      type: object
      required: [fileId, text]
      properties:
        fileId:
          type: string
          format: uuid
        text:
          type: string

    TextPrependedEvent:
      type: object
      required: [fileId, text]
      properties:
        fileId:
          type: string
          format: uuid
        text:
          type: string

    AttachmentSavedEvent:
      type: object
      required: [attachmentId, fileName, contentType, sizeBytes]
      properties:
        attachmentId:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64

    ProcessingCompletedEvent:
      type: object
      required: [operationId]
      properties:
        operationId:
          type: string
          format: uuid

    ProcessingFailedEvent:
      type: object
      required: [operationId, error, code]
      properties:
        operationId:
          type: string
          format: uuid
        error:
          type: string
        code:
          type: string
          enum:
            - LlmConnectionFailed
            - LlmInvalidResponse
            - FileOperationFailed
            - InternalError
